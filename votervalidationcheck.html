<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Age Validator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input, button {
      padding: 8px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Check If Your Age Is Valid (Between 18 and 150)</h2>

  <form id="ageForm">
    <input type="number" id="ageInput" placeholder="Enter your age" required />
    <button type="submit">Check</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("ageForm").addEventListener("submit", function(event) {
      event.preventDefault(); // Prevents form from refreshing the page

      const age = parseInt(document.getElementById("ageInput").value);
      const isValid = age >= 18 && age <= 150;

      const resultElement = document.getElementById("result");
      if (isNaN(age)) {
        resultElement.textContent = "Please enter a valid number.";
        resultElement.style.color = "red";
      } else if (isValid) {
        resultElement.textContent = "✅ Age is valid!";
        resultElement.style.color = "green";
      } else {
        resultElement.textContent = "❌ Age is not valid.";
        resultElement.style.color = "red";
      }
    });
  </script>

</body>
</html>
